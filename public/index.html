<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Income rates</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Income rates</h1>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel-head">
        <h2>Presets</h2>
        <button id="add-preset" type="button" disabled>Save current</button>
      </div>
      <ul id="presets" class="presets"></ul>
      <p id="presets-empty" class="note">No presets yet. Enter a rate in the table and click "Save current".</p>
    </aside>

    <main id="main" hidden>
      <section class="panel">
        <div id="currency-tools" class="currency-tools">
          <div class="combo">
            <input id="add-currency" type="text" autocomplete="off" spellcheck="false"
              role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="currency-options"
              placeholder="Add currency…" aria-label="Add currency by code or name">
            <ul id="currency-options" class="combo-list" role="listbox" aria-label="Currencies" hidden></ul>
          </div>
        </div>
        <div class="matrix-wrap">
          <table id="matrix" class="matrix"></table>
        </div>
        <p id="assumptions" class="note"></p>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Exchange rates</h2>
          <button id="reset-rates" type="button">Reset rates</button>
        </div>
        <ul id="rates" class="rates"></ul>
        <p id="rates-source" class="note"></p>
        <p class="note">
          Changes here apply to this page only. Rates are loaded for yesterday's date from a public API.
        </p>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
